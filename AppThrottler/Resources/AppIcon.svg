<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="triangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- White background with proper padding -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <g clip-path="url(#round)">
    <!-- Main triangle — centered with padding like Apple/Vercel icons -->
    <!-- Vercel triangle is ~55% of canvas, centered -->
    <polygon points="256,115 385,365 127,365" fill="url(#triangle)"/>

    <!-- Speed gauge arc -->
    <path d="M 170 320 A 90 90 0 0 1 342 320"
          fill="none" stroke="#0070F3" stroke-width="7" stroke-linecap="round"/>

    <!-- Gauge ticks -->
    <line x1="178" y1="306" x2="186" y2="315" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="210" y1="282" x2="218" y2="293" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="256" y1="272" x2="256" y2="284" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="302" y1="282" x2="294" y2="293" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="334" y1="306" x2="326" y2="315" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Needle -->
    <line x1="256" y1="320" x2="200" y2="295" stroke="#0070F3" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="256" cy="320" r="4.5" fill="white"/>

    <!-- Down arrow -->
    <g transform="translate(80, 380)">
      <path d="M 14 0 L 14 22 L 7 15 M 14 22 L 21 15" fill="none" stroke="#0070F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Up arrow -->
    <g transform="translate(392, 365)">
      <path d="M 14 22 L 14 0 L 7 7 M 14 0 L 21 7" fill="none" stroke="#0070F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Signal waves -->
    <g transform="translate(332, 175)">
      <path d="M 0 18 Q 11 9 22 18" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M -4 26 Q 11 13 26 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    </g>
  </g>

  <!-- Version badge — top right corner, outside triangle -->
  <g transform="translate(374, 50)">
    <rect x="0" y="0" width="72" height="26" rx="13" fill="#0070F3"/>
    <text x="36" y="18" text-anchor="middle" fill="white" font-family="-apple-system, SF Pro Text, Helvetica, Arial" font-size="12" font-weight="600">v2.0</text>
  </g>
</svg>
